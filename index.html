<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a19"><title>Fut de Quinta • Ao Vivo</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#eaf4f1;background:#0c1413}*{box-sizing:border-box}body{margin:0}main{max-width:840px;margin:auto;padding:18px 14px 55px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand{font-size:24px;font-weight:850;letter-spacing:-.7px}.sub{color:#96ada5;font-size:12px;margin-top:4px}.tag{font-size:11px;color:#b8edd8;background:#153d32;border:1px solid #28644c;padding:7px 10px;border-radius:999px;white-space:nowrap}.panel{background:#15211f;border:1px solid #2c3c37;padding:17px;border-radius:17px;margin:12px 0}.muted{color:#9bb3ab}.small{font-size:12px}.title{font-weight:750;margin:0 0 13px;font-size:17px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.team{background:#1b2a26;border:1px solid #30473f;border-radius:14px;padding:14px;min-width:0}.team h3{font-size:16px;margin:0 0 10px}.player{font-size:13px;padding:4px 0;overflow-wrap:anywhere}.star{color:#ffd97e;font-weight:750}button{border:0;border-radius:11px;background:#35c984;color:#082215;padding:12px 13px;font-size:14px;font-weight:760;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#294039;color:#e7f4eb}.danger{background:#e77274;color:#2f0c0c}.outline{background:transparent;border:1px solid #3b554b;color:#d1e6dc}button.wide{width:100%}input,textarea,select{display:block;width:100%;background:#0e1916;border:1px solid #39554a;color:white;padding:11px;border-radius:10px;font:inherit}textarea{resize:vertical;min-height:100px}label{display:block;font-size:12px;color:#bad3c6;margin:12px 0 6px}.foot{padding:10px;font-size:12px;color:#9cb2a9;text-align:center}.pill{display:inline-block;border-radius:99px;padding:5px 9px;background:#33493f;font-size:11px}.pills{display:flex;gap:8px;flex-wrap:wrap}.notice{border-left:3px solid #e9bc72;padding:9px 11px;background:#302919;border-radius:6px;margin:10px 0;font-size:12px;line-height:1.5}.ok{color:#86e8b5}.err{color:#ff9b9b}.hidden{display:none!important}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{flex:1}.status{font-size:12px;margin:8px 0;min-height:18px}.divider{border:0;border-top:1px solid #33453f;margin:16px 0}.empty{text-align:center;padding:28px 16px}.headrow{display:flex;justify-content:space-between;align-items:center;gap:7px}.labelled{color:#9fb9ad;font-size:11px;margin:8px 0}.flex2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}@media(max-width:390px){.brand{font-size:20px}.team{padding:10px}.player{font-size:12px}main{padding:12px 9px 40px}.panel{padding:12px}} .pot{display:inline-block;border-radius:5px;padding:1px 4px;font-size:10px;font-weight:750;white-space:nowrap}.pot-1{color:#ffdf91;background:#41351c}.pot-2{color:#ace6ff;background:#193c4a}.player{line-height:1.5}textarea{min-width:0}.flex2{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar button{min-width:max-content}</style></head><body><main>
<header class="top"><div><div class="brand">⚽ FUT DE QUINTA</div><div class="sub">Times e rodízio compartilhados • Firebase</div></div><div class="tag" id="connection">● Conectando</div></header>
<section class="panel"><div class="row"><div><b id="roleText">👀 Modo espectador</b><div class="sub" id="lastSync">Sincronizando...</div></div><button id="authBtn" class="secondary">Entrar para editar</button></div><div id="authForm" class="hidden"><label for="username">Usuário</label><input id="username" placeholder="henrique" autocomplete="username" autocapitalize="none"><label for="password">Senha</label><input id="password" placeholder="Senha" type="password" autocomplete="current-password"><div class="toolbar" style="margin-top:11px"><button id="loginBtn">Entrar</button><button id="cancelLogin" class="outline">Cancelar</button></div><div id="loginError" class="status err"></div></div></section>
<div class="status" id="message" aria-live="polite"></div><div id="app"></div>
<footer class="foot">Acesso de teste • Quem tem o link pode acompanhar. Login de JavaScript é apenas visual, não protege o Firebase.</footer></main>
<script>
'use strict';
const DB='https://fut-de-quinta-46c70-default-rtdb.firebaseio.com/futebol/state.json';
const ADMINS=['leopz','chico','henrique','estevao','caique','leom'];
const KEY='futdequinta_role_v1';
const defaultNames=['Estevão','Celso','Kaique','Lucas','Léo Pz','Henrique','Caique','Rogerio','Hugo','Francenir','Renan','Chico','Renan R','Nicolas','Lucas Tette','Leo M','Vini','Marcos','LD','Cauan','Miqueias','Edric','Jhol','Guedes'];
const defaultPote=['Renan','Chico','Leo M','Léo Pz'];
const EDITOR_PASSWORD = '12345';

const TEAM_IDS = [1, 2, 3, 4];
const TEAM_SIZE = 5;
const PLAYER_COUNT = TEAM_IDS.length * TEAM_SIZE;
const DRAW_VERSION = 4;
const $ = id => document.getElementById(id);
const clean = value => String(value ?? '').normalize('NFD')
  .replace(/[\u0300-\u036f]/g, '').toLowerCase().trim().replace(/\s+/g, ' ');
const escapeHTML = value => String(value).replace(/[&<>"']/g, ch => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
})[ch]);
const teamLabel = id => `Time ${Number(id)}`;
const team = (s, id) => s.teams.find(t => t.id === id);
const rosterOf = s => s.teams.flatMap(t => t.players).concat(s.extras || []);
const isCurrentDraw = s => s?.version === DRAW_VERSION;
const parseNames = value => value.split(/[\n,;]+/).map(name => name.trim()).filter(Boolean);

let role = sessionStorage.getItem(KEY) || '';
let state = null;
let editing = false;
let busy = false;
let requesting = false;
let fetchError = false;
let loaded = false;
let writeRevision = 0;

function shuffled(values) {
  const result = [...values];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function showMsg(message, isError = false) {
  $('message').textContent = message;
  $('message').className = 'status ' + (isError ? 'err' : 'ok');
}

function makeInitial(names, firstPot, secondPot) {
  if (names.length !== PLAYER_COUNT) {
    throw Error(`A lista precisa ter exatamente ${PLAYER_COUNT} jogadores. Total informado: ${names.length}.`);
  }
  const byName = new Map(names.map(name => [clean(name), name]));
  if (byName.size !== PLAYER_COUNT) throw Error('Existem nomes duplicados na lista de jogadores.');

  const pots = [firstPot, secondPot].map((pot, index) => {
    const keys = pot.map(clean);
    if (keys.length !== TEAM_IDS.length || new Set(keys).size !== TEAM_IDS.length) {
      throw Error(`O Pote ${index + 1} precisa ter 4 jogadores diferentes.`);
    }
    if (keys.some(key => !byName.has(key))) {
      throw Error(`Todos os jogadores do Pote ${index + 1} precisam estar na lista de 20 jogadores.`);
    }
    return shuffled(keys.map(key => byName.get(key)));
  });
  const potPlayers = new Set(pots.flat());
  if (potPlayers.size !== TEAM_IDS.length * pots.length) {
    throw Error('Um jogador só pode participar de um pote. Confira os nomes repetidos entre os potes.');
  }
  const others = shuffled(names.filter(name => !potPlayers.has(name)));
  const freeSlots = TEAM_SIZE - pots.length;
  const teams = TEAM_IDS.map((id, i) => ({
    id,
    players: shuffled([
      pots[0][i], pots[1][i],
      ...others.slice(i * freeSlots, (i + 1) * freeSlots)
    ])
  }));
  return {
    version: DRAW_VERSION, teams, captains: pots[0], pot2: pots[1],
    field: [], queue: [], round: 1, started: false, history: []
  };
}

function listPlayers(players, s) {
  const firstPot = new Set(s.captains.map(clean));
  const secondPot = new Set(s.pot2.map(clean));
  return players.map(player => {
    const key = clean(player);
    const pot = firstPot.has(key) ? 1 : secondPot.has(key) ? 2 : 0;
    return `<div class="player">${escapeHTML(player)}${pot ? ` <span class="pot pot-${pot}">Pote ${pot}</span>` : ''}</div>`;
  }).join('');
}

function teamCard(s, id, canLose = false) {
  const { players } = team(s, id);
  return `<div class="team">
    <div class="headrow"><h3>${teamLabel(id)}</h3><span class="pill">${players.length}/${TEAM_SIZE}</span></div>
    ${listPlayers(players, s)}
    ${canLose && role ? `<button class="danger wide" style="margin-top:12px" data-lose="${id}" aria-label="${teamLabel(id)} perdeu">Perdeu</button>` : ''}
  </div>`;
}

function render() {
  $('roleText').textContent = role ? '✏️ Editando: ' + role : '👀 Modo espectador';
  $('authBtn').textContent = role ? 'Sair' : 'Entrar para editar';
  if (editing) return;
  const app = $('app');
  if (!loaded) {
    app.innerHTML = '<section class="panel empty"><p class="muted">Aguardando os dados compartilhados.</p></section>';
    return;
  }
  if (!state) {
    app.innerHTML = `<section class="panel empty"><h2>Nenhum sorteio ainda</h2>
      <p class="muted">${role ? 'Cadastre os 20 jogadores e os dois potes para começar.' : 'Aguardando um dos organizadores criar os times.'}</p>
      ${role ? '<button data-config>Criar primeira partida</button>' : ''}
    </section>`;
    return;
  }
  if (!isCurrentDraw(state)) {
    renderPreviousDraw(app, state);
    return;
  }
  if (!state.started) {
    renderBeforeKickoff(app, state);
    return;
  }
  renderMatch(app, state);
}

function renderPreviousDraw(app, s) {
  app.innerHTML = `<section class="panel">
    <h2 class="title">Sorteio anterior</h2>
    <p class="notice">Este sorteio está disponível para consulta. Para iniciar o rodízio com quatro times de cinco, faça um novo sorteio.</p>
    ${s.started && s.field.length === 2 ? `<p class="small muted">Partida ${s.round} em campo · ${s.field.map(teamLabel).join(' × ')}</p>` : ''}
    <div class="grid">${s.teams.filter(t => t.players.length).map(t => teamCard(s, t.id)).join('')}</div>
    ${s.extras.length ? `<p class="small muted">Reservas: ${escapeHTML(s.extras.join(', '))}</p>` : ''}
    ${role ? `<div class="toolbar" style="margin-top:12px"><button data-config>Configurar novo sorteio</button>
      <button class="danger" data-reset>🗑️ Zerar testes</button></div>` : ''}
  </section>`;
}

function teamOptions(ids) {
  return ids.map(id => `<option value="${id}">${teamLabel(id)}</option>`).join('');
}

function renderBeforeKickoff(app, s) {
  app.innerHTML = `<section class="panel">
    <div class="row"><h2 class="title">Times sorteados</h2><span class="pill">20 jogadores</span></div>
    <div class="grid">${TEAM_IDS.map(id => teamCard(s, id)).join('')}</div>
    ${role ? `<hr class="divider"><h3>Escolher primeira partida</h3>
      <div class="flex2">
        <div><label for="firstA">Primeiro time</label><select id="firstA">${teamOptions(TEAM_IDS)}</select></div>
        <div><label for="firstB">Adversário</label><select id="firstB">${teamOptions([2, 1, 3, 4])}</select></div>
      </div>
      <button class="wide" style="margin-top:12px" data-start>▶ Iniciar partida</button>
      <div class="toolbar" style="margin-top:8px">
        <button class="secondary" data-config>Editar lista</button>
        <button class="secondary" data-resort>Sortear novamente</button>
        <button class="danger" data-reset>🗑️ Zerar testes</button>
      </div>` : ''}
  </section>`;
}

function renderMatch(app, s) {
  const last = s.history.at(-1);
  app.innerHTML = `<section class="panel">
    <div class="row"><h2 class="title">🏟️ Em campo</h2><span class="pill">Partida ${s.round} · 20 jogadores</span></div>
    <div class="grid">${s.field.map(id => teamCard(s, id, true)).join('')}</div>
  </section>
  <section class="panel">
    <h2 class="title">⏭️ Próximos a jogar</h2>
    <div class="grid">${s.queue.map((id, i) => `<div>
      <p class="labelled">${i + 1}º da fila</p>${teamCard(s, id)}
    </div>`).join('')}</div>
    ${last ? `<p class="small muted">${teamLabel(last.lost)} perdeu e foi para o fim da fila. ${teamLabel(last.next)} entrou em campo.</p>` : ''}
  </section>
  ${role ? `<section class="panel"><div class="toolbar">
    <button class="secondary" data-undo ${last ? '' : 'disabled'}>↶ Desfazer</button>
    <button class="outline" data-config>⚙️ Novo sorteio / lista</button>
    <button class="danger" data-reset>🗑️ Zerar testes</button>
  </div></section>` : ''}`;
}

function openConfig() {
  editing = true;
  const roster = state ? rosterOf(state) : defaultNames;
  const firstPot = state ? state.captains : defaultPote;
  const secondPot = state?.pot2 || [];
  showMsg('');
  $('app').innerHTML = `<section class="panel">
    <h2 class="title">⚙️ Configurar sorteio</h2>
    <p class="muted small">Informe 20 nomes na lista geral, incluindo os 8 dos potes. Cada time recebe um jogador de cada pote e três dos outros 12.</p>
    <label for="roster">Lista geral · 20 jogadores, um por linha</label>
    <textarea id="roster" rows="12">${escapeHTML(roster.join('\n'))}</textarea>
    <div class="flex2">
      <div><label for="captains">Pote 1 · 4 jogadores</label>
      <textarea id="captains" rows="4">${escapeHTML(firstPot.join('\n'))}</textarea></div>
      <div><label for="pot2">Pote 2 · 4 jogadores</label>
      <textarea id="pot2" rows="4">${escapeHTML(secondPot.join('\n'))}</textarea></div>
    </div>
    ${state ? '<p class="notice">Um novo sorteio substitui a rodada salva para todos os celulares.</p>' : ''}
    <button class="wide" data-create>🎲 Sortear times</button>
    <div class="toolbar" style="margin-top:8px">
      <button class="secondary" data-cancel>Cancelar</button>
      <button class="danger" data-reset>🗑️ Zerar testes</button>
    </div>
  </section>`;
}

function normalizeState(data) {
  if (data === null) return null;
  if (!Array.isArray(data?.teams)) throw Error('Não foi possível ler o sorteio salvo.');
  const teams = data.teams.filter(Boolean).map(t => ({
    id: Number(t.id), players: Array.isArray(t.players) ? t.players.filter(Boolean) : []
  }));
  const s = {
    version: data.version,
    teams,
    captains: data.captains ?? defaultPote,
    pot2: data.pot2 ?? [],
    field: data.field ?? [],
    queue: data.queue ?? [],
    round: data.round ?? 1,
    started: Boolean(data.started),
    history: Array.isArray(data.history) ? data.history : [],
    updatedAt: data.updatedAt
  };
  if (!isCurrentDraw(s)) s.extras = data.extras ?? data.bench ?? [];
  if (isCurrentDraw(s)) {
    s.history = s.history.map(({ lost, next, previous }) => ({
      lost, next, previous: { field: previous.field, queue: previous.queue, round: previous.round }
    }));
    const hasFourTeams = teams.length === TEAM_IDS.length &&
      TEAM_IDS.every(id => team(s, id)?.players.length === TEAM_SIZE);
    const isValidLineup = !s.started || (s.field.length === 2 && s.queue.length === 2 &&
      TEAM_IDS.every(id => [...s.field, ...s.queue].includes(id)));
    if (!hasFourTeams || !isValidLineup) throw Error('Os times ou a fila do sorteio salvo estão incompletos.');
  }
  return s;
}

async function apiGet() {
  const response = await fetch(DB + '?t=' + Date.now(), { cache: 'no-store' });
  if (!response.ok) throw Error(`Leitura negada pelo Firebase (${response.status}). Confira as regras.`);
  return normalizeState(await response.json());
}

function applyState(nextState) {
  const changed = !loaded || JSON.stringify(nextState) !== JSON.stringify(state);
  state = nextState;
  loaded = true;
  return changed;
}

async function refresh() {
  if (busy || editing || requesting) return;
  requesting = true;
  const revision = writeRevision;
  try {
    const latest = await apiGet();
    if (busy || editing || writeRevision !== revision) return;
    if (applyState(latest)) render();
    if (fetchError) showMsg('✅ Conexão restabelecida.');
    fetchError = false;
    $('connection').textContent = '● Conectado';
    $('connection').style.color = '#b8edd8';
    $('lastSync').textContent = 'Atualização automática a cada 3 segundos';
  } catch (error) {
    if (busy || writeRevision !== revision) return;
    $('connection').textContent = '● Sem conexão';
    $('connection').style.color = '#ffb0b0';
    if (!fetchError) showMsg('Não foi possível acessar o Firebase: ' + error.message, true);
    fetchError = true;
  } finally {
    requesting = false;
  }
}

async function save(newState) {
  if (!role || busy || !loaded) return;
  busy = true;
  writeRevision++;
  const removing = newState === null;
  showMsg(removing ? 'Apagando dados compartilhados...' : 'Salvando para todos...');
  try {
    const latest = await apiGet();
    if (applyState(latest)) {
      render();
      showMsg('O sorteio mudou em outro celular. Confira a atualização antes de tentar novamente.', true);
      return;
    }
    const options = removing ? { method: 'DELETE' } : {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...newState, updatedAt: Math.max(Date.now(), (state?.updatedAt || 0) + 1) })
    };
    const response = await fetch(DB, options);
    if (!response.ok) throw Error(`Firebase rejeitou a alteração (${response.status}). Confira as regras.`);
    applyState(normalizeState(await response.json()));
    editing = false;
    render();
    showMsg(removing ? '✅ Testes zerados no Firebase para todos os celulares.' : '✅ Atualizado para todos os jogadores.');
  } catch (error) {
    showMsg(error.message, true);
  } finally {
    busy = false;
  }
}

function startMatch() {
  if (!isCurrentDraw(state) || state.started) return;
  const field = [Number($('firstA').value), Number($('firstB').value)];
  if (new Set(field).size !== 2 || !field.every(id => TEAM_IDS.includes(id))) {
    return showMsg('Escolha dois times diferentes.', true);
  }
  const queue = TEAM_IDS.filter(id => !field.includes(id));
  save({ ...state, field, queue, started: true, round: 1, history: [] });
}

function handleLose(lost) {
  if (!isCurrentDraw(state) || !state.started || !state.field.includes(lost)) return;
  const [next, ...rest] = state.queue;
  const winner = state.field.find(id => id !== lost);
  const previous = { field: state.field, queue: state.queue, round: state.round };
  const history = [...state.history, { lost, next, previous }].slice(-25);
  save({ ...state, field: [winner, next], queue: [...rest, lost], round: state.round + 1, history });
}

function undo() {
  const last = state?.history.at(-1);
  if (!isCurrentDraw(state) || !last?.previous) return;
  const { field, queue, round } = last.previous;
  save({ ...state, field, queue, round, history: state.history.slice(0, -1) });
}

function resetAll() {
  if (confirm('Zerar TODOS os testes? Isso apagará o sorteio, as partidas e o histórico para TODOS os celulares.')) save(null);
}

function draw(names, firstPot, secondPot) {
  try {
    const newState = makeInitial(names, firstPot, secondPot);
    if (state?.started && !confirm('Substituir o sorteio e a partida em andamento para todos os celulares?')) return;
    save(newState);
  } catch (error) {
    showMsg(error.message, true);
  }
}

$('authBtn').onclick = () => {
  if (!role) {
    $('authForm').classList.toggle('hidden');
    return;
  }
  role = '';
  sessionStorage.removeItem(KEY);
  $('authForm').classList.add('hidden');
  editing = false;
  render();
};
$('cancelLogin').onclick = () => $('authForm').classList.add('hidden');
$('loginBtn').onclick = () => {
  const name = clean($('username').value).replace(/\s/g, '');
  if (!ADMINS.includes(name) || $('password').value !== EDITOR_PASSWORD) {
    $('loginError').textContent = 'Nome ou senha inválidos.';
    return;
  }
  role = name;
  sessionStorage.setItem(KEY, name);
  $('authForm').classList.add('hidden');
  $('password').value = '';
  $('loginError').textContent = '';
  render();
};
$('app').addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button || !role || busy || !loaded) return;
  const action = Object.keys(button.dataset)[0];
  switch (action) {
    case 'config': openConfig(); break;
    case 'cancel':
      editing = false;
      showMsg('');
      render();
      refresh();
      break;
    case 'create':
      draw(parseNames($('roster').value), parseNames($('captains').value), parseNames($('pot2').value));
      break;
    case 'resort':
      if (isCurrentDraw(state) && !state.started) draw(rosterOf(state), state.captains, state.pot2);
      break;
    case 'start': startMatch(); break;
    case 'lose': handleLose(Number(button.dataset.lose)); break;
    case 'undo': undo(); break;
    case 'reset': resetAll(); break;
  }
});

render();
refresh();
setInterval(refresh, 3000);
</script>
</body></html>
