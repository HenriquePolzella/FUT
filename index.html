<section class="panel"><div class="row"><div><b id="roleText">👀 Modo espectador</b><div class="sub" id="lastSync">Sincronizando...</div></div><button id="authBtn" class="secondary">Entrar para editar</button></div><div id="authForm" class="hidden"><label for="username">Usuário</label><input id="username" placeholder="henrique" autocomplete="username" autocapitalize="none"><label for="password">Senha</label><input id="password" placeholder="Senha" type="password" autocomplete="current-password"><div class="toolbar" style="margin-top:11px"><button id="loginBtn">Entrar</button><button id="cancelLogin" class="outline">Cancelar</button></div><div id="loginError" class="status err"></div></div></section>

<script>
'use strict';
const DB='https://fut-de-quinta-46c70-default-rtdb.firebaseio.com/futebol/state.json';
const ADMINS=['leopz','chico','henrique','estevao','caique','leom'];
const KEY='futdequinta_role_v1';
const defaultNames=['Estevão','Celso','Kaique','Lucas','Léo Pz','Henrique','Caique','Rogerio','Hugo','Francenir','Renan','Chico','Renan R','Nicolas','Lucas Tette','Leo M','Vini','Marcos','LD','Cauan','Miqueias','Edric','Jhol','Guedes'];
const defaultPote=['Renan','Chico','Leo M','Léo Pz'];
const EDITOR_PASSWORD = '12345';

const TEAM_SIZE = 5;
const MIN_PLAYERS = 15;
const MAX_PLAYERS = 25;
const DRAW_VERSION = 5;
const LOCAL_DRAW_KEY = KEY + '_local_draw';
const LOCAL_MODE_KEY = KEY + '_local_mode';
const $ = id => document.getElementById(id);
const clean = value => String(value ?? '').normalize('NFD')
  .replace(/[\u0300-\u036f]/g, '').toLowerCase().trim().replace(/\s+/g, ' ');
const escapeHTML = value => String(value).replace(/[&<>"']/g, ch => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
})[ch]);
const teamLabel = id => `Time ${Number(id)}`;
const team = (s, id) => s.teams.find(t => t.id === id);
const rosterOf = s => s.teams.flatMap(t => t.players).concat(s.extras || []);
const isCurrentDraw = s => [4, DRAW_VERSION].includes(s?.version);
const fullTeamIds = s => s.teams.filter(t => t.players.length === TEAM_SIZE).map(t => t.id);
const waitingTeam = s => s.teams.find(t => t.players.length < TEAM_SIZE);
const parseNames = value => value.split(/[\n,;]+/).map(name => name.trim()).filter(Boolean);

function readStorage(storage, key) {
  try { return window[storage].getItem(key); } catch { return null; }
}

function writeStorage(storage, key, value) {
  try {
    if (value === null) window[storage].removeItem(key);
    else window[storage].setItem(key, value);
    return true;
  } catch {
    return false;
  }
}

let role = readStorage('sessionStorage', KEY) || '';
let localMode = false;
let localState = null;
let hasLocalState = false;
let localStored = false;
let state = null;
let editing = false;
let busy = false;
let requesting = false;
let connectionError = null;
let loaded = false;
let writeRevision = 0;

function shuffled(values) {
  const result = [...values];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function showMsg(message, isError = false) {
  $('message').textContent = message;
  $('message').className = 'status ' + (isError ? 'err' : 'ok');
}

function renderConnection() {
  const tag = $('connection');
  const status = $('lastSync');
  const panel = $('connectionPanel');
  panel.classList.toggle('hidden', !localMode && !connectionError);
  $('localModeBtn').classList.toggle('hidden', localMode);
  $('sharedModeBtn').textContent = localMode ? 'Voltar ao modo compartilhado' : 'Tentar reconectar';
  if (localMode) {
    tag.textContent = '● Modo local';
    tag.style.color = '#ffdf91';
    status.textContent = localStored ? 'Sorteio salvo neste navegador' : 'Uso neste navegador';
    $('connectionDetail').textContent = localState && !localStored
      ? 'O navegador bloqueou o armazenamento. O sorteio fica disponível enquanto esta página estiver aberta.'
      : 'As alterações deste modo ficam neste navegador.';
    return;
  }
  if (connectionError) {
    const denied = [401, 403].includes(connectionError.status);
    tag.textContent = denied ? '● Acesso bloqueado' : '● Sem conexão';
    tag.style.color = '#ffb0b0';
    status.textContent = 'Sincronização pausada';
    $('connectionDetail').textContent = denied
      ? 'O Firebase recusou o acesso ao sorteio compartilhado. O login do site libera os controles de edição, e o acesso ao banco depende das permissões do projeto.'
      : 'O sorteio compartilhado está indisponível. Você pode tentar novamente ou usar o sorteio neste navegador.';
    return;
  }
  tag.textContent = loaded ? '● Conectado' : '● Conectando';
  tag.style.color = '#b8edd8';
  status.textContent = loaded ? 'Atualização automática a cada 3 segundos' : 'Sincronizando...';
}

function enableLocalMode() {
  if (busy || localMode) return;
  const draft = editing ? ['roster', 'captains', 'pot2'].map(id => $(id).value) : null;
  writeRevision++;
  if (!hasLocalState) {
    try {
      localState = normalizeState(JSON.parse(readStorage('localStorage', LOCAL_DRAW_KEY)));
      localStored = localState !== null;
    } catch {
      localState = null;
    }
    hasLocalState = true;
  }
  localMode = true;
  writeStorage('sessionStorage', LOCAL_MODE_KEY, '1');
  applyState(localState);
  editing = false;
  showMsg('');
  renderConnection();
  render();
  if (draft && role) openConfig(draft);
}

function connectShared() {
  if (busy) return;
  if (localMode) {
    if (editing && !confirm('Sair do modo local e descartar as alterações ainda abertas na lista?')) return;
    writeRevision++;
    localMode = false;
    writeStorage('sessionStorage', LOCAL_MODE_KEY, null);
    state = null;
    loaded = false;
    editing = false;
    connectionError = null;
    showMsg('');
    renderConnection();
    render();
  }
  refresh();
}

function makeInitial(names, firstPot = [], secondPot = []) {
  if (names.length < MIN_PLAYERS || names.length > MAX_PLAYERS) {
    throw Error(`A lista precisa ter de ${MIN_PLAYERS} a ${MAX_PLAYERS} jogadores. Total informado: ${names.length}.`);
  }
  const byName = new Map(names.map(name => [clean(name), name]));
  if (byName.size !== names.length) throw Error('Existem nomes duplicados na lista de jogadores.');

  const missing = [];
  const pots = [firstPot, secondPot].map((pot, index) => {
    const keys = pot.map(clean);
    if (new Set(keys).size !== keys.length) {
      throw Error(`Existem nomes repetidos no Pote ${index + 1}.`);
    }
    const absent = pot.filter((_, position) => !byName.has(keys[position]));
    if (absent.length) {
      missing.push(`Pote ${index + 1} — ${absent.join(', ')}`);
    }
    return keys.map(key => byName.get(key));
  });
  if (missing.length) {
    throw Error(`Confira estes nomes na lista geral. ${missing.join('. ')}.`);
  }
  const potPlayers = new Set(pots.flat());
  if (potPlayers.size !== firstPot.length + secondPot.length) {
    throw Error('Um jogador só pode participar de um pote. Confira os nomes repetidos entre os potes.');
  }
  const [firstDraw, secondDraw] = pots.map(shuffled);
  const others = shuffled(names.filter(name => !potPlayers.has(name)));
  const teams = Array.from({ length: Math.ceil(names.length / TEAM_SIZE) }, (_, index) => ({
    id: index + 1, players: []
  }));
  const capacities = teams.map((_, index) => Math.min(TEAM_SIZE, names.length - index * TEAM_SIZE));
  for (const group of [firstDraw, secondDraw, others]) {
    const counts = teams.map(() => 0);
    for (const player of group) {
      const available = shuffled(teams.map((_, index) => index))
        .filter(index => teams[index].players.length < capacities[index]);
      available.sort((a, b) => counts[a] - counts[b] ||
        capacities[b] - capacities[a] ||
        teams[a].players.length / capacities[a] - teams[b].players.length / capacities[b]);
      const index = available[0];
      teams[index].players.push(player);
      counts[index]++;
    }
  }
  teams.forEach(t => { t.players = shuffled(t.players); });
  return {
    version: DRAW_VERSION, teams, captains: firstDraw, pot2: secondDraw,
    field: [], queue: [], round: 1, started: false, history: []
  };
}

function listPlayers(players, s) {
  const firstPot = new Set(s.captains.map(clean));
  const secondPot = new Set(s.pot2.map(clean));
  return players.map(player => {
    const key = clean(player);
    const pot = firstPot.has(key) ? 1 : secondPot.has(key) ? 2 : 0;
    return `<div class="player">${escapeHTML(player)}${pot ? ` <span class="pot pot-${pot}">Pote ${pot}</span>` : ''}</div>`;
  }).join('');
}

function teamCard(s, id, canLose = false) {
  const { players } = team(s, id);
  return `<div class="team">
    <div class="headrow"><h3>${teamLabel(id)}</h3><span class="pill">${players.length}/${TEAM_SIZE}</span></div>
    ${listPlayers(players, s)}
    ${canLose && role ? `<button class="danger wide" style="margin-top:12px" data-lose="${id}" aria-label="${teamLabel(id)} perdeu">Perdeu</button>` : ''}
  </div>`;
}

function render() {
  $('roleText').textContent = role ? '✏️ Editando: ' + role : '👀 Modo espectador';
  $('authBtn').textContent = role ? 'Sair' : 'Entrar para editar';
  if (editing) return;
  const app = $('app');
  if (!loaded) {
    app.innerHTML = connectionError ? '' :
      '<section class="panel empty"><p class="muted">Aguardando os dados compartilhados.</p></section>';
    return;
  }
  if (!state) {
    app.innerHTML = `<section class="panel empty"><h2>Nenhum sorteio ainda</h2>
      <p class="muted">${role ? 'Cadastre de 15 a 25 jogadores. Os potes são opcionais.'
        : localMode ? 'Entre para editar e criar o sorteio neste navegador.' : 'Aguardando um dos organizadores criar os times.'}</p>
      ${role ? '<button data-config>Criar primeira partida</button>' : ''}
    </section>`;
    return;
  }
  if (!isCurrentDraw(state)) {
    renderPreviousDraw(app, state);
    return;
  }
  if (!state.started) {
    renderBeforeKickoff(app, state);
    return;
  }
  renderMatch(app, state);
}

function renderPreviousDraw(app, s) {
  app.innerHTML = `<section class="panel">
    <h2 class="title">Sorteio anterior</h2>
    <p class="notice">Este sorteio está disponível para consulta. Para usar o rodízio atualizado, faça um novo sorteio.</p>
    ${s.started && s.field.length === 2 ? `<p class="small muted">Partida ${s.round} em campo · ${s.field.map(teamLabel).join(' × ')}</p>` : ''}
    <div class="grid">${s.teams.filter(t => t.players.length).map(t => teamCard(s, t.id)).join('')}</div>
    ${s.extras.length ? `<p class="small muted">Reservas: ${escapeHTML(s.extras.join(', '))}</p>` : ''}
    ${role ? `<div class="toolbar" style="margin-top:12px"><button data-config>Configurar novo sorteio</button>
      <button class="danger" data-reset>🗑️ Zerar testes</button></div>` : ''}
  </section>`;
}

function teamOptions(ids) {
  return ids.map(id => `<option value="${id}">${teamLabel(id)}</option>`).join('');
}

function renderBeforeKickoff(app, s) {
  const ids = fullTeamIds(s);
  const opponentIds = [ids[1], ids[0], ...ids.slice(2)];
  app.innerHTML = `<section class="panel">
    <div class="row"><h2 class="title">Times sorteados</h2><span class="pill">${rosterOf(s).length} jogadores</span></div>
    <div class="grid">${s.teams.map(t => teamCard(s, t.id)).join('')}</div>
    ${waitingTeam(s) ? '<p class="small muted">O grupo incompleto será completado com jogadores sorteados do time que perder.</p>' : ''}
    ${role ? `<hr class="divider"><h3>Escolher primeira partida</h3>
      <div class="flex2">
        <div><label for="firstA">Primeiro time</label><select id="firstA">${teamOptions(ids)}</select></div>
        <div><label for="firstB">Adversário</label><select id="firstB">${teamOptions(opponentIds)}</select></div>
      </div>
      <button class="wide" style="margin-top:12px" data-start>▶ Iniciar partida</button>
      <div class="toolbar" style="margin-top:8px">
        <button class="secondary" data-config>Editar lista</button>
        <button class="secondary" data-resort>Sortear novamente</button>
        <button class="danger" data-reset>🗑️ Zerar testes</button>
      </div>` : ''}
  </section>`;
}

function renderMatch(app, s) {
  const last = s.history.at(-1);
  app.innerHTML = `<section class="panel">
    <div class="row"><h2 class="title">🏟️ Em campo</h2><span class="pill">Partida ${s.round} · ${rosterOf(s).length} jogadores</span></div>
    <div class="grid">${s.field.map(id => teamCard(s, id, true)).join('')}</div>
  </section>
  <section class="panel">
    <h2 class="title">⏭️ Próximos a jogar</h2>
    <div class="grid">${s.queue.map((id, i) => `<div>
      <p class="labelled">${i + 1}º da fila</p>${teamCard(s, id)}
    </div>`).join('')}</div>
    ${waitingTeam(s) ? `<h3>Grupo incompleto</h3>${teamCard(s, waitingTeam(s).id)}` : ''}
    ${last ? `<p class="small muted">${teamLabel(last.lost)} perdeu. ${teamLabel(last.next)} entrou em campo.
      ${last.completed ? `${escapeHTML(last.moved.join(', '))} completaram o ${teamLabel(last.completed)}, que entrou no fim da fila.` : `${teamLabel(last.lost)} foi para o fim da fila.`}</p>` : ''}
  </section>
  ${role ? `<section class="panel"><div class="toolbar">
    <button class="secondary" data-undo ${last ? '' : 'disabled'}>↶ Desfazer</button>
    <button class="outline" data-config>⚙️ Novo sorteio / lista</button>
    <button class="danger" data-reset>🗑️ Zerar testes</button>
  </div></section>` : ''}`;
}

function openConfig(draft) {
  editing = true;
  const roster = state ? rosterOf(state) : defaultNames;
  const firstPot = state ? state.captains : defaultPote;
  const secondPot = state?.pot2 || [];
  showMsg('');
  $('app').innerHTML = `<section class="panel">
    <h2 class="title">⚙️ Configurar sorteio</h2>
    <p class="muted small">Informe de 15 a 25 jogadores presentes. Use um ou dois potes com a quantidade de nomes que tiver, ou deixe ambos vazios. Os nomes dos potes também devem estar na lista geral.</p>
    <label for="roster">Lista geral · 15 a 25 jogadores, um por linha</label>
    <textarea id="roster" rows="12">${escapeHTML(draft?.[0] ?? roster.join('\n'))}</textarea>
    <div class="flex2">
      <div><label for="captains">Pote 1 · opcional</label>
      <textarea id="captains" rows="4">${escapeHTML(draft?.[1] ?? firstPot.join('\n'))}</textarea></div>
      <div><label for="pot2">Pote 2 · opcional</label>
      <textarea id="pot2" rows="4">${escapeHTML(draft?.[2] ?? secondPot.join('\n'))}</textarea></div>
    </div>
    ${state ? `<p class="notice">Um novo sorteio substitui a rodada ${localMode ? 'salva neste navegador' : 'compartilhada'}.</p>` : ''}
    <button class="wide" data-create>🎲 Sortear times</button>
    <div class="toolbar" style="margin-top:8px">
      <button class="secondary" data-cancel>Cancelar</button>
      <button class="danger" data-reset>🗑️ Zerar testes</button>
    </div>
  </section>`;
}

function normalizeState(data) {
  if (data === null) return null;
  if (!Array.isArray(data?.teams)) throw Error('Não foi possível ler o sorteio salvo.');
  const teams = data.teams.filter(Boolean).map(t => ({
    id: Number(t.id), players: Array.isArray(t.players) ? t.players.filter(Boolean) : []
  }));
  const s = {
    version: data.version,
    teams,
    captains: data.captains ?? (isCurrentDraw(data) ? [] : defaultPote),
    pot2: data.pot2 ?? [],
    field: data.field ?? [],
    queue: data.queue ?? [],
    round: data.round ?? 1,
    started: Boolean(data.started),
    history: Array.isArray(data.history) ? data.history : [],
    updatedAt: data.updatedAt
  };
  if (!isCurrentDraw(s)) s.extras = data.extras ?? data.bench ?? [];
  if (isCurrentDraw(s)) {
    s.history = s.history.map(({ lost, next, completed, moved, previous }) => ({
      lost, next, completed: completed ?? null, moved: moved ?? [],
      previous: {
        field: previous.field, queue: previous.queue, round: previous.round,
        ...(previous.teams ? { teams: previous.teams } : {})
      }
    }));
    const roster = rosterOf(s);
    const ids = fullTeamIds(s);
    const active = [...s.field, ...s.queue];
    const validTeams = roster.length >= MIN_PLAYERS && roster.length <= MAX_PLAYERS &&
      new Set(roster.map(clean)).size === roster.length &&
      teams.length === Math.ceil(roster.length / TEAM_SIZE) &&
      new Set(teams.map(t => t.id)).size === teams.length &&
      teams.every(t => Number.isInteger(t.id) && t.id > 0 && t.players.length > 0 && t.players.length <= TEAM_SIZE) &&
      teams.filter(t => t.players.length < TEAM_SIZE).length <= 1;
    const validLineup = !s.started || (s.field.length === 2 && active.length === ids.length &&
      new Set(active).size === ids.length && ids.every(id => active.includes(id)));
    if (!validTeams || !validLineup) throw Error('Os times ou a fila do sorteio salvo estão incompletos.');
  }
  return s;
}

async function apiGet() {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 8000);
  try {
    const response = await fetch(DB + '?t=' + Date.now(), { cache: 'no-store', signal: controller.signal });
    if (!response.ok) {
      const error = Error(`O Firebase não retornou o sorteio (HTTP ${response.status}).`);
      error.status = response.status;
      throw error;
    }
    return normalizeState(await response.json());
  } finally {
    clearTimeout(timeout);
  }
}

function applyState(nextState) {
  const changed = !loaded || JSON.stringify(nextState) !== JSON.stringify(state);
  state = nextState;
  loaded = true;
  return changed;
}

async function refresh() {
  if (localMode || busy || editing || requesting) return;
  requesting = true;
  const revision = writeRevision;
  try {
    const latest = await apiGet();
    if (busy || editing || writeRevision !== revision) return;
    if (applyState(latest)) render();
    if (connectionError) showMsg('✅ Conexão restabelecida.');
    connectionError = null;
    renderConnection();
  } catch (error) {
    if (busy || writeRevision !== revision) return;
    connectionError = error;
    renderConnection();
    if (!loaded) render();
  } finally {
    requesting = false;
  }
}

async function save(newState) {
  if (!role || busy || !loaded) return;
  busy = true;
  writeRevision++;
  const removing = newState === null;
  const record = removing ? null : {
    ...newState, updatedAt: Math.max(Date.now(), (state?.updatedAt || 0) + 1)
  };
  if (localMode) {
    const written = writeStorage('localStorage', LOCAL_DRAW_KEY, removing ? null : JSON.stringify(record));
    busy = false;
    if (removing && !written && localStored) return showMsg('O navegador recusou apagar o sorteio salvo.', true);
    localStored = written && !removing;
    localState = record;
    applyState(record);
    editing = false;
    renderConnection();
    render();
    showMsg(removing ? '✅ Sorteio local apagado.' : localStored
      ? '✅ Sorteio salvo neste navegador.' : 'Sorteio disponível até fechar ou recarregar esta página.');
    return;
  }
  showMsg(removing ? 'Apagando dados compartilhados...' : 'Salvando para todos...');
  try {
    const latest = await apiGet();
    if (applyState(latest)) {
      render();
      showMsg('O sorteio mudou em outro celular. Confira a atualização antes de tentar novamente.', true);
      return;
    }
    const options = removing ? { method: 'DELETE' } : {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(record)
    };
    const response = await fetch(DB, options);
    if (!response.ok) {
      const error = Error(`Firebase rejeitou a alteração (${response.status}). Confira as regras.`);
      error.status = response.status;
      throw error;
    }
    applyState(normalizeState(await response.json()));
    editing = false;
    connectionError = null;
    renderConnection();
    render();
    showMsg(removing ? '✅ Testes zerados no Firebase para todos os celulares.' : '✅ Atualizado para todos os jogadores.');
  } catch (error) {
    if ([401, 403].includes(error.status)) {
      connectionError = error;
      renderConnection();
    }
    showMsg(error.message, true);
  } finally {
    busy = false;
  }
}

function startMatch() {
  if (!isCurrentDraw(state) || state.started) return;
  const ids = fullTeamIds(state);
  const field = [Number($('firstA').value), Number($('firstB').value)];
  if (new Set(field).size !== 2 || !field.every(id => ids.includes(id))) {
    return showMsg('Escolha dois times diferentes.', true);
  }
  const queue = ids.filter(id => !field.includes(id));
  save({ ...state, field, queue, started: true, round: 1, history: [] });
}

function handleLose(lost) {
  if (!isCurrentDraw(state) || !state.started || !state.field.includes(lost)) return;
  save(rotateAfterLoss(state, lost));
}

function rotateAfterLoss(current, lost) {
  const s = structuredClone(current);
  const [next, ...rest] = s.queue;
  const winner = s.field.find(id => id !== lost);
  const previous = { teams: current.teams, field: current.field, queue: current.queue, round: current.round };
  const waiting = waitingTeam(s);
  let moved = [];
  let completed = null;
  if (waiting) {
    const losing = team(s, lost);
    moved = chooseTransfers(s, losing.players, waiting.players);
    losing.players = losing.players.filter(player => !moved.includes(player));
    waiting.players.push(...moved);
    completed = waiting.id;
  }
  s.field = [winner, next];
  s.queue = [...rest, completed ?? lost];
  s.round++;
  s.history = [...s.history, { lost, next, completed, moved, previous }].slice(-25);
  return s;
}

function chooseTransfers(s, losing, waiting) {
  const missing = TEAM_SIZE - waiting.length;
  const groups = [s.captains, s.pot2];
  const total = rosterOf(s).length;
  const candidates = [];
  let best = Infinity;
  for (let mask = 0; mask < 1 << losing.length; mask++) {
    const moved = losing.filter((_, index) => mask & (1 << index));
    if (moved.length !== missing) continue;
    const completed = [...waiting, ...moved];
    const remaining = losing.filter(player => !moved.includes(player));
    const score = groups.reduce((sum, pot) => {
      const count = players => players.filter(player => pot.includes(player)).length;
      return sum + (count(completed) - TEAM_SIZE * pot.length / total) ** 2 +
        (count(remaining) - remaining.length * pot.length / total) ** 2;
    }, 0);
    if (score < best - 1e-9) { best = score; candidates.length = 0; }
    if (Math.abs(score - best) < 1e-9) candidates.push(moved);
  }
  return shuffled(candidates)[0];
}

function undo() {
  const last = state?.history.at(-1);
  if (!isCurrentDraw(state) || !last?.previous) return;
  const { field, queue, round, teams = state.teams } = last.previous;
  save({ ...state, teams, field, queue, round, history: state.history.slice(0, -1) });
}

function resetAll() {
  const scope = localMode ? 'deste navegador' : 'de todos os celulares';
  if (confirm(`Zerar os testes? Isso apagará o sorteio, as partidas e o histórico ${scope}.`)) save(null);
}

function draw(names, firstPot, secondPot) {
  try {
    const newState = makeInitial(names, firstPot, secondPot);
    if (state?.started && !confirm(localMode
      ? 'Substituir o sorteio e a partida em andamento neste navegador?'
      : 'Substituir o sorteio e a partida em andamento para todos os celulares?')) return;
    save(newState);
  } catch (error) {
    showMsg(error.message, true);
  }
}

$('authBtn').onclick = () => {
  if (!role) {
    $('authForm').classList.toggle('hidden');
    return;
  }
  role = '';
  writeStorage('sessionStorage', KEY, null);
  $('authForm').classList.add('hidden');
  editing = false;
  render();
};
$('cancelLogin').onclick = () => $('authForm').classList.add('hidden');
$('loginBtn').onclick = () => {
  const name = clean($('username').value).replace(/\s/g, '');
  if (!ADMINS.includes(name) || $('password').value !== EDITOR_PASSWORD) {
    $('loginError').textContent = 'Nome ou senha inválidos.';
    return;
  }
  role = name;
  writeStorage('sessionStorage', KEY, name);
  $('authForm').classList.add('hidden');
  $('password').value = '';
  $('loginError').textContent = '';
  render();
};
$('app').addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button || !role || busy || !loaded) return;
  const action = Object.keys(button.dataset)[0];
  switch (action) {
    case 'config': openConfig(); break;
    case 'cancel':
      editing = false;
      showMsg('');
      render();
      refresh();
      break;
    case 'create':
      draw(parseNames($('roster').value), parseNames($('captains').value), parseNames($('pot2').value));
      break;
    case 'resort':
      if (isCurrentDraw(state) && !state.started) draw(rosterOf(state), state.captains, state.pot2);
      break;
    case 'start': startMatch(); break;
    case 'lose': handleLose(Number(button.dataset.lose)); break;
    case 'undo': undo(); break;
    case 'reset': resetAll(); break;
  }
});

$('localModeBtn').onclick = enableLocalMode;
$('sharedModeBtn').onclick = connectShared;
if (readStorage('sessionStorage', LOCAL_MODE_KEY) === '1') enableLocalMode();
else {
  render();
  refresh();
}
setInterval(refresh, 3000);
</script>
</body></html>
